<div class="back-link">
  <a routerLink="/autores">← Volver</a>
</div>

@if (autor()) {
  <div class="author-header">
    <div class="author-avatar">{{ autor()!.nombre[0] }}</div>
    <div>
      <h1>{{ autor()!.nombre }}</h1>
      <span class="nationality-tag">{{ autor()!.nacionalidad }}</span>
    </div>
  </div>
}

<div class="section">
  <h2>Libros</h2>

  <div class="book-list">
    @for (libro of libros(); track libro.id) {
      <div class="book-card">
        <div class="book-info">
          <span class="book-title">{{ libro.titulo }}</span>
          <span class="book-year">{{ libro.anio }}</span>
        </div>
        @if (libro.genero) {
          <span class="book-genre">{{ libro.genero }}</span>
        }
      </div>
    }
    @empty {
      <p class="empty">Este autor no tiene libros registrados.</p>
    }
  </div>
</div>
